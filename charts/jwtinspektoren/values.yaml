replicaCount: 2

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Off by default: tokens passed as /<token> would otherwise end up in the access log.
accessLog: false

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: jwtinspektoren.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: jwtinspektoren-tls
  #    hosts:
  #      - jwtinspektoren.example.com

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
